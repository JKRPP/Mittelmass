name: Android release (TWA)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: ""

      - name: Point Bubblewrap's SDK root at the installed cmdline-tools
        # Bubblewrap requires bin/ directly under the SDK root, but setup-android nests it in a versioned folder
        run: |
          cmdline_bin=$(find "$ANDROID_SDK_ROOT/cmdline-tools" -maxdepth 2 -type d -name bin | head -n1)
          ln -s "$cmdline_bin" "$ANDROID_SDK_ROOT/bin"

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Point Bubblewrap at the JDK/SDK from the steps above
        # Written by hand because any bubblewrap command (even updateConfig) opens an interactive wizard without it
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_SDK_ROOT"
          }
          EOF

      - name: Generate Android project from twa-manifest.json
        run: bubblewrap update

      - name: Restore signing keystore
        run: |
          mkdir -p android-keystore
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android-keystore/upload.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build signed APK/AAB
        # Bubblewrap has no password flags; these env vars are the only non-interactive option
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPath android-keystore/upload.jks \
            --signingKeyAlias "$ANDROID_KEY_ALIAS"
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mittelmass-android-${{ github.ref_name }}
          path: |
            app-release-signed.apk
            app-release-bundle.aab

      - name: Attach APK to GitHub Release
        run: gh release create "$TAG" app-release-signed.apk --title "$TAG" --generate-notes
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
