<!doctype html>
<html lang="de" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Mittelmaß 2.0</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="wrap" id="app">
      <!-- LOBBY -->
      <section id="v-lobby">
        <div class="card">
          <h2 id="lobbyTitle">Willkommen bei Mittelmaß 2.0</h2>
          <div id="lobbyJoin" class="hide">
            <p class="note" style="margin-top: 0">
              Du trittst Raum <b id="lobbyCode"></b> bei.
            </p>
          </div>
          <label class="sub" for="nm" style="display: block; margin: 10px 0 6px"
            >Dein Name</label
          >
          <input
            type="text"
            id="nm"
            autocomplete="name"
            enterkeyhint="go"
            placeholder="Dein Name"
          />
          <div id="lobbyCreate">
            <label
              class="sub"
              for="rc"
              style="display: block; margin-bottom: 6px"
              >Raumcode</label
            >
            <input
              type="text"
              id="rc"
              autocapitalize="characters"
              autocomplete="off"
              maxlength="4"
              placeholder="z. B. K7QM"
              style="letter-spacing: 0.14em"
            />
            <hr class="sep" />
            <button class="btn" id="btnJoinCode">Beitreten</button>
            <button class="btn ghost" id="btnCreate">
              Neuen Raum erstellen
            </button>
          </div>
          <button class="btn hide" id="btnJoin">Beitreten</button>
          <div class="err" id="lobbyErr"></div>
        </div>
      </section>

      <!-- MAIN -->
      <div id="main" class="hide">
        <div class="bar">
          <span class="dot" id="cdot"></span>
          <span id="cstate">verbinde …</span>
          <span class="sp"></span>
          <button class="themebtn" id="themeBtn"></button>
          <span id="whoami"></span>
          <button class="leavebtn" id="leaveBtn">Verlassen</button>
        </div>

        <section id="v-sheet">
          <div class="card">
            <div class="hd">
              <button class="navbtn" id="prev">&#8249;</button>
              <h1 id="spkName">&nbsp;</h1>
              <button class="navbtn" id="next">&#8250;</button>
            </div>
            <div class="sub" id="spkSub"></div>
            <div id="crits"></div>
            <div class="dedu hide" id="deduRow">
              <span class="l">Abzug (Chair)</span>
              <button class="dedopt" data-lvl="">Keine</button>
              <button class="dedopt" data-lvl="small">−3</button>
              <button class="dedopt" data-lvl="big">−15</button>
            </div>
            <div class="sum">
              <span>Gesamtpunkte</span><span><b id="spkTot">0</b></span>
            </div>
            <div class="exclrow">
              <button class="exclbtn" id="exclBtn"></button>
            </div>
            <hr class="sep" />
            <div id="padHost"></div>
            <div class="foot">
              <span id="lastEntry">Noch keine Eingabe</span>
              <button class="undo hide" id="undoBtn">Rückgängig</button>
            </div>
          </div>
        </section>

        <section id="v-team" class="hide">
          <div class="card">
            <div class="hd">
              <button class="navbtn" id="tprev">&#8249;</button>
              <h1 id="tmName">&nbsp;</h1>
              <button class="navbtn" id="tnext">&#8250;</button>
            </div>
            <div class="sub" id="tmSub"></div>
            <div id="tcrits"></div>
            <div class="sum">
              <span>Teampunkte</span><span><b id="tmTot">0</b> / 200</span>
            </div>
            <div class="exclrow">
              <button class="exclbtn" id="texclBtn"></button>
            </div>
            <hr class="sep" />
            <div id="tpadHost"></div>
            <div class="foot"><span id="tlastEntry"></span></div>
          </div>
        </section>

        <section id="v-matrix" class="hide">
          <div class="card">
            <h2>Meine Wertung</h2>
            <div id="matrix"></div>
          </div>
        </section>

        <section id="v-chair" class="hide">
          <div class="card">
            <h2>Raum <span id="chCode"></span></h2>
            <div class="sub">Link zum Teilen</div>
            <input type="text" id="shareUrl" readonly />
            <button class="btn ghost" id="btnCopy">Link kopieren</button>
            <div id="judges" style="margin-top: 14px"></div>
          </div>
          <div class="card">
            <h2>Abweichungen - Reden</h2>
            <div id="totspread"></div>
          </div>
          <div class="card">
            <h2>Abweichungen - Teampunkte</h2>
            <div id="spread"></div>
          </div>
          <div class="card">
            <h2>Endergebnis</h2>
            <div class="sub">
              Durchschnitt über alle einbezogenen Juror:innen.
            </div>
            <div id="finalResult"></div>
            <button class="btn ghost" id="btnBallot">Ballot anzeigen</button>
            <div id="ballotWrap" class="hide" style="margin-top: 12px"></div>
          </div>
        </section>
      </div>
    </div>

    <nav class="tabs hide" id="tabs">
      <button data-t="sheet" aria-pressed="true">Reden</button>
      <button data-t="team" aria-pressed="false">Team</button>
      <button data-t="matrix" aria-pressed="false">Übersicht</button>
      <button data-t="chair" aria-pressed="false" id="tabChair">Chair</button>
    </nav>

    <script src="/static/app.js"></script>
  </body>
</html>
